version: '3.8'

services:
  pharmacy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-super_jwt_access_secret_key_12345}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_jwt_refresh_secret_key_67890}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
    env_file:
      - .env
